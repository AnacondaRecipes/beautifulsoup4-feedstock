{% set version = "4.13.4" %}

package:
  name: beautifulsoup4-split
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/b/beautifulsoup4/beautifulsoup4-{{ version }}.tar.gz
  sha256: dbb3c4e1ceae6aefebdaf2423247260cd062430a410e38c66f2baa50a8437195

build:
  number: 0
  skip: true  # [py<36]

outputs:
  - name: beautifulsoup4
    script: build_base.bat  # [win]
    script: build_base.sh   # [not win]
    requirements:
      host:
        - hatchling >=1.8.0
        - pip
        - python
      run:
        - python
        - soupsieve >1.2
        - typing-extensions
    test:
      imports:
        - bs4
        - bs4.builder
      requires:
        - pip
        - lxml
        - html5lib
        - pytest >=6
      commands:
        - pip check
        - pytest --pyargs bs4 -k "not (test_rejected_markup or test_rejected_input)"

  - name: bs4
    build:
      noarch: generic
    requirements:
      host:
        - python
      run:
        - python
        - {{ pin_subpackage('beautifulsoup4', max_pin="x.x.x") }}
    test:
      imports:
        - bs4
      requires:
        - pip
      commands:
        - pip check

about:
  home: https://www.crummy.com/software/BeautifulSoup/
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python library designed for screen-scraping
  description: |
    Beautiful Soup is a library for pulling data out of HTML and XML files.
    It provides ways of navigating, searching, and modifying parse trees.
  doc_url: https://beautiful-soup-4.readthedocs.io/
  dev_url: https://code.launchpad.net/beautifulsoup

extra:
  recipe-maintainers:
    - jschueller
    - nehaljwani
  skip-lints:
    - missing_wheel
    - missing_python_build_tool
